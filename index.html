<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IRON ARENA BEAT EDITION</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #ffcc00; --bg: #050505; --card: rgba(20, 20, 22, 0.9); }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        .global-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), 
                        url('https://images.unsplash.com/photo-1583454110551-21f2fa2ec617?q=80&w=1470&auto=format&fit=crop'); 
            background-size: cover; background-position: center; z-index: -1;
        }

        /* Эффект пульсации под бит */
        .beat-active { animation: beat-glow 0.5s infinite alternate; }
        @keyframes beat-glow { from { box-shadow: inset 0 0 10px rgba(255,204,0,0); } to { box-shadow: inset 0 0 30px rgba(255,204,0,0.2); } }

        .screen { display: none; width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; flex-direction: column; gap: 10px; z-index: 10; }
        .active { display: flex; }
        
        .lvl-container { background: var(--card); padding: 12px; border-radius: 15px; border: 1px solid #333; }
        .lvl-bar { height: 6px; background: #222; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .lvl-fill { height: 100%; background: var(--accent); width: 0%; transition: 1s; box-shadow: 0 0 10px var(--accent); }

        .card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #333; text-align: center; }
        .btn { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }

        .battle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .video-box { position: relative; width: 100%; aspect-ratio: 9/16; background: #111; border-radius: 15px; overflow: hidden; border: 2px solid #444; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .local-video { transform: scaleX(-1); }

        #timer-wrap { align-self: center; background: rgba(0,0,0,0.8); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--accent); font-family: monospace; font-size: 18px; color: var(--accent); z-index: 20; }

        .reactions { display: flex; justify-content: center; gap: 20px; margin-top: 5px; }
        .reaction-btn { font-size: 30px; cursor: pointer; transition: 0.2s; }
        .reaction-btn:active { transform: scale(1.4); }

        .score-val { font-size: 22px; font-weight: 900; color: var(--accent); }
        .result-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
    </style>
</head>
<body id="main-body">

    <div class="global-bg"></div>

    <!-- Аудио элемент для бита -->
    <audio id="battle-beat" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"></audio>

    <div id="result-screen" class="result-overlay">
        <h2 id="win-lose-text" style="font-size: 40px; margin: 0;"></h2>
        <p id="score-details" style="font-size: 20px; color: var(--accent); margin-bottom: 20px;"></p>
        <button class="btn" style="width: 200px; background: #ffaa00;" onclick="location.reload()">РЕВАНШ</button>
    </div>

    <!-- МЕНЮ -->
    <div id="menu" class="screen active">
        <div class="lvl-container">
            <div style="display: flex; justify-content: space-between; font-size: 11px;">
                <span id="display-nick">CHAMPION</span>
                <span>LVL: <span id="lvl-val">1</span></span>
            </div>
            <div class="lvl-bar"><div id="lvl-fill" class="lvl-fill"></div></div>
        </div>
        <div class="card" style="margin-top: 50px;">
            <h1 style="color:var(--accent); font-style: italic;">IRON ARENA</h1>
            <button class="btn" onclick="showScreen('profile')">ПРОФИЛЬ</button>
            <div style="height: 10px;"></div>
            <button class="btn btn-outline" onclick="showScreen('lobby')">НАЙТИ БОЙ</button>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="profile" class="screen">
        <div class="card">
            <h2>ПРОФИЛЬ</h2>
            <input type="text" id="nick-input" placeholder="Твой ник" style="width:80%; padding:10px; border-radius: 8px; border:none;">
            <input type="color" id="color-input" style="width:100%; margin-top:10px; height: 40px; border:none; background:none;">
            <button class="btn" onclick="saveProfile()" style="margin-top:20px;">СОХРАНИТЬ</button>
        </div>
    </div>

    <!-- ЛОББИ -->
    <div id="lobby" class="screen">
        <div class="card">
            <h2>ЛОББИ</h2>
            <button class="btn" onclick="copyID()">КОПИРОВАТЬ ID</button>
            <p id="my-id" style="font-size:10px; color:#555; margin: 10px 0;"></p>
            <input type="text" id="peer-id" placeholder="ID СОПЕРНИКА" style="width:80%; padding:10px; border-radius: 8px; border:none;">
            <button class="btn btn-outline" onclick="connect()">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <!-- АРЕНА -->
    <div id="arena" class="screen">
        <div id="timer-wrap">TIME: <span id="timer-val">15</span>s</div>
        <div class="battle-grid">
            <div class="video-box">
                <video id="localVideo" class="local-video" autoplay muted playsinline></video>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div id="wait-msg" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:10px; color:#444;">WAITING...</div>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="card" style="padding:10px;"><div id="my-score" class="score-val">0.0</div></div>
            <div class="card" style="padding:10px;"><div id="enemy-score" class="score-val">0.0</div></div>
        </div>
        <div class="reactions">
            <div class="reaction-btn" onclick="sendEmoji('🔥')">🔥</div>
            <div class="reaction-btn" onclick="sendEmoji('💪')">💪</div>
            <div class="reaction-btn" onclick="sendEmoji('👎')">👎</div>
        </div>
        <button id="start-btn" class="btn" style="margin-top:10px; display:none;" onclick="startBattle()">START BATTLE</button>
    </div>

    <canvas id="motionCanvas" style="display:none;" width="100" height="150"></canvas>

    <script>
        const peer = new Peer();
        let conn, myStream, myScore = 0, enemyScore = 0, isBattle = false;
        let lastFrameData = null;
        const beat = document.getElementById('battle-beat');

        function updateUI() {
            const wins = parseInt(localStorage.getItem('wins') || '0');
            document.getElementById('lvl-val').innerText = Math.floor(wins/3) + 1;
            document.getElementById('lvl-fill').style.width = ((wins%3)/3*100) + "%";
            document.documentElement.style.setProperty('--accent', localStorage.getItem('color') || '#ffcc00');
            document.getElementById('display-nick').innerText = localStorage.getItem('nick') || 'CHAMPION';
        }
        updateUI();

        function saveProfile() {
            localStorage.setItem('nick', document.getElementById('nick-input').value);
            localStorage.setItem('color', document.getElementById('color-input').value);
            updateUI(); showScreen('menu');
        }

        async function initCam() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                document.getElementById('localVideo').srcObject = myStream;
            } catch(e) { console.log("Камера недоступна"); }
        }
        initCam();

        peer.on('open', id => document.getElementById('my-id').innerText = id);

        function connect() {
            const id = document.getElementById('peer-id').value;
            conn = peer.connect(id);
            setupConn(conn);
            const call = peer.call(id, myStream);
            call.on('stream', stream => setRemoteStream(stream));
        }

        peer.on('connection', c => setupConn(c));
        peer.on('call', call => {
            call.answer(myStream);
            call.on('stream', stream => setRemoteStream(stream));
        });

        function setRemoteStream(stream) {
            const rv = document.getElementById('remoteVideo');
            rv.srcObject = stream;
            rv.onloadedmetadata = () => {
                rv.play();
                document.getElementById('wait-msg').style.display = 'none';
                showScreen('arena');
                document.getElementById('start-btn').style.display = 'block';
            };
        }

        function setupConn(c) {
            conn = c;
            conn.on('data', data => {
                if(data.type === 'EMOJI') showFloatingEmoji(data.val);
                if(data.type === 'START') runBattleLogic();
                if(data.type === 'SCORE') document.getElementById('enemy-score').innerText = data.val;
                if(data.type === 'FINAL') { enemyScore = data.val; finalize(); }
            });
        }

        function sendEmoji(e) { if(conn) conn.send({type:'EMOJI', val:e}); showFloatingEmoji(e); }
        function startBattle() { if(conn) { conn.send({type:'START'}); runBattleLogic(); } }

        function runBattleLogic() {
            isBattle = true; myScore = 0;
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('main-body').classList.add('beat-active');
            
            // Запуск бита
            beat.currentTime = 0;
            beat.play().catch(e => console.log("Нужен клик для музыки"));

            let t = 15;
            const timerIv = setInterval(() => {
                document.getElementById('timer-val').innerText = t;
                t--;
                if(t < 0) { 
                    clearInterval(timerIv); isBattle = false;
                    beat.pause(); // Стоп бит
                    document.getElementById('main-body').classList.remove('beat-active');
                    conn.send({type:'FINAL', val: myScore}); finalize();
                }
            }, 1000);

            const canvas = document.getElementById('motionCanvas');
            const ctx = canvas.getContext('2d');
            const video = document.getElementById('localVideo');
            const sense = setInterval(() => {
                if(!isBattle) { clearInterval(sense); return; }
                ctx.drawImage(video, 0, 0, 100, 150);
                const currentFrame = ctx.getImageData(0,0,100,150).data;
                if(lastFrameData) {
                    let diff = 0;
                    for(let i=0; i<currentFrame.length; i+=4) diff += Math.abs(currentFrame[i] - lastFrameData[i]);
                    if(diff > 500000) {
                        myScore += (diff / 1500000);
                        document.getElementById('my-score').innerText = myScore.toFixed(1);
                        conn.send({type:'SCORE', val: myScore.toFixed(1)});
                    }
                }
                lastFrameData = currentFrame;
            }, 100);
        }

        function finalize() {
            if(!isBattle && enemyScore !== 0) {
                const win = myScore > enemyScore;
                if(win) localStorage.setItem('wins', parseInt(localStorage.getItem('wins') || '0') + 1);
                document.getElementById('win-lose-text').innerText = win ? "VICTORY" : "DEFEAT";
                document.getElementById('win-lose-text').style.color = win ? "#00ff88" : "#ff3366";
                document.getElementById('score-details').innerText = `${myScore.toFixed(1)} XP vs ${enemyScore} XP`;
                document.getElementById('result-screen').style.display = 'flex';
                updateUI();
            }
        }

        function showFloatingEmoji(e) {
            const el = document.createElement('div');
            el.innerText = e;
            el.style.cssText = `position:fixed; left:${Math.random()*80}%; bottom:0; font-size:50px; transition:2s; z-index:1000; pointer-events:none;`;
            document.body.appendChild(el);
            setTimeout(() => { el.style.bottom = '100vh'; el.style.opacity = '0'; }, 50);
            setTimeout(() => el.remove(), 2000);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function copyID() { navigator.clipboard.writeText(peer.id); alert("ID Copied!"); }
    </script>
</body>
</html>
