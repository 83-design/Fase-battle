<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IRON ARENA FINAL</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #ffcc00; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        
        .global-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1583454110551-21f2fa2ec617?q=80&w=1470&auto=format&fit=crop'); 
            background-size: cover; background-position: center; z-index: -1;
        }

        .screen { display: none; width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; flex-direction: column; gap: 15px; margin: 0 auto; }
        .active { display: flex; }
        
        .card { background: rgba(25, 25, 27, 0.95); padding: 20px; border-radius: 20px; border: 1px solid #333; text-align: center; backdrop-filter: blur(5px); }
        .btn { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }

        .battle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .video-box { position: relative; width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #444; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        #timer-wrap { text-align: center; font-size: 20px; color: var(--accent); font-weight: bold; padding: 10px; }
        .score-val { font-size: 24px; font-weight: 900; color: var(--accent); }
        
        .result-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
    </style>
</head>
<body>

    <div class="global-bg"></div>
    <audio id="battle-beat" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"></audio>

    <div id="result-screen" class="result-overlay">
        <h2 id="win-lose-text" style="font-size: 40px;"></h2>
        <p id="score-details"></p>
        <button class="btn" style="width: 200px;" onclick="location.reload()">В МЕНЮ</button>
    </div>

    <!-- МЕНЮ -->
    <div id="menu" class="screen active">
        <h1 style="text-align:center; color:var(--accent); margin-top: 50px;">IRON ARENA</h1>
        <div class="card">
            <button class="btn" onclick="showScreen('lobby')">ИГРАТЬ 1V1</button>
            <button class="btn btn-outline" style="margin-top:10px;" onclick="showScreen('profile')">ПРОФИЛЬ</button>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="profile" class="screen">
        <div class="card">
            <h2>ПРОФИЛЬ</h2>
            <input type="text" id="nick-input" placeholder="Ник" style="width:100%; padding:12px; margin-bottom:10px; box-sizing: border-box;">
            <button class="btn" onclick="saveProfile()">СОХРАНИТЬ</button>
        </div>
    </div>

    <!-- ЛОББИ -->
    <div id="lobby" class="screen">
        <div class="card">
            <h2>ЛОББИ</h2>
            <p style="font-size: 12px;">Твой ID:</p>
            <p id="my-id-val" style="font-size: 14px; color: var(--accent); font-weight: bold;"></p>
            <input type="text" id="peer-id-input" placeholder="ID друга" style="width:100%; padding:12px; margin-bottom:10px; box-sizing: border-box;">
            <button class="btn" onclick="connectToFriend()">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <!-- АРЕНА -->
    <div id="arena" class="screen">
        <div id="timer-wrap">TIME: <span id="timer-val">15</span></div>
        <div class="battle-grid">
            <div class="video-box"><video id="localVideo" autoplay muted playsinline style="transform: scaleX(-1);"></video></div>
            <div class="video-box"><video id="remoteVideo" autoplay playsinline></video></div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
            <div class="card" style="padding:10px;">YOU: <span id="my-score" class="score-val">0</span></div>
            <div class="card" style="padding:10px;">ENEMY: <span id="enemy-score" class="score-val">0</span></div>
        </div>
        <button id="start-btn" class="btn" style="margin-top:15px; display:none;" onclick="startBattle()">НАЧАТЬ МАТЧ</button>
    </div>

    <canvas id="motionCanvas" style="display:none;" width="100" height="150"></canvas>

    <script>
        const peer = new Peer();
        let conn, myStream, myScore = 0, enemyScore = 0, isBattle = false;
        let lastFrameData = null;

        // Показать экран
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Сохранение ника
        function saveProfile() {
            localStorage.setItem('nick', document.getElementById('nick-input').value);
            showScreen('menu');
        }

        // Камера
        async function init() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                document.getElementById('localVideo').srcObject = myStream;
            } catch(e) { console.log("Камера заблокирована"); }
        }
        init();

        // PeerJS события
        peer.on('open', id => document.getElementById('my-id-val').innerText = id);
        
        peer.on('connection', c => { conn = c; setupConn(); });
        peer.on('call', call => {
            call.answer(myStream);
            call.on('stream', s => { 
                document.getElementById('remoteVideo').srcObject = s;
                showScreen('arena');
                document.getElementById('start-btn').style.display = 'block';
            });
        });

        function connectToFriend() {
            const id = document.getElementById('peer-id-input').value;
            conn = peer.connect(id);
            setupConn();
            peer.call(id, myStream).on('stream', s => {
                document.getElementById('remoteVideo').srcObject = s;
                showScreen('arena');
                document.getElementById('start-btn').style.display = 'block';
            });
        }

        function setupConn() {
            conn.on('data', data => {
                if(data.type === 'START') runMatch();
                if(data.type === 'SCORE') document.getElementById('enemy-score').innerText = data.val;
                if(data.type === 'FINAL') { enemyScore = data.val; checkWinner(); }
            });
        }

        function startBattle() {
            conn.send({type: 'START'});
            runMatch();
        }

        function runMatch() {
            isBattle = true; myScore = 0;
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('battle-beat').play().catch(() => {});
            
            let t = 15;
            const timer = setInterval(() => {
                document.getElementById('timer-val').innerText = t;
                t--;
                if(t < 0) {
                    clearInterval(timer);
                    isBattle = false;
                    document.getElementById('battle-beat').pause();
                    conn.send({type: 'FINAL', val: myScore});
                    checkWinner();
                }
            }, 1000);

            // Детектор движения
            const canvas = document.getElementById('motionCanvas');
            const ctx = canvas.getContext('2d');
            const video = document.getElementById('localVideo');
            
            const loop = setInterval(() => {
                if(!isBattle) { clearInterval(loop); return; }
                ctx.drawImage(video, 0, 0, 100, 150);
                const current = ctx.getImageData(0,0,100,150).data;
                if(lastFrameData) {
                    let diff = 0;
                    for(let i=0; i<current.length; i+=4) diff += Math.abs(current[i] - lastFrameData[i]);
                    if(diff > 500000) {
                        myScore += (diff / 2000000);
                        document.getElementById('my-score').innerText = myScore.toFixed(0);
                        conn.send({type: 'SCORE', val: myScore.toFixed(0)});
                    }
                }
                lastFrameData = current;
            }, 100);
        }

        function checkWinner() {
            if(!isBattle && enemyScore > 0) {
                const win = myScore > enemyScore;
                document.getElementById('win-lose-text').innerText = win ? "ПОБЕДА" : "ПРОИГРЫШ";
                document.getElementById('score-details').innerText = `${myScore.toFixed(0)} vs ${enemyScore}`;
                document.getElementById('result-screen').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
