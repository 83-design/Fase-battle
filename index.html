<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Omoggle Clone</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0d;
            --card-bg: #161618;
            --accent-blue: #40e0d0;
            --text-gray: #8e8e93;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Карточка профиля / Арены */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border: 1px solid #2c2c2e;
            margin-bottom: 15px;
            position: relative;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #34c759;
            border-radius: 50%;
            margin-right: 5px;
        }

        .title {
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: #fff;
        }

        /* Стили камер */
        .video-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        video {
            width: 100%;
            border-radius: 16px;
            background: #000;
            /* Убираем зеркальность */
            transform: scaleX(-1); 
            border: 1px solid #40e0d033;
        }

        /* Прогресс бар как на скрине */
        .progress-container {
            margin-top: 15px;
        }
        .progress-bar {
            height: 6px;
            background: #2c2c2e;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #40e0d0, #007aff);
            width: 77%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-gray);
        }

        .btn-main {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        #status-msg {
            font-size: 14px;
            color: var(--accent-blue);
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="status-msg">ИНИЦИАЛИЗАЦИЯ...</div>

    <!-- Блок 1V1 ARENA (Твой профиль) -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-gray);">
            <span><span class="online-dot"></span> 4.6K ONLINE</span>
            <span style="color: var(--accent-blue)">387 ELO</span>
        </div>
        <div class="title">1V1 ARENA</div>
        
        <div class="video-container">
            <video id="localVideo" autoplay muted playsinline></video>
            <video id="remoteVideo" autoplay playsinline style="display:none; border-color: #ff3b30;"></video>
        </div>

        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px;">
                <span>77%</span>
                <span>114 ELO NEEDED</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <button class="btn-main" onclick="startDuel()">СОЗДАТЬ ДУЭЛЬ</button>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusMsg = document.getElementById('status-msg');
        
        const peer = new Peer();

        // Включаем камеру сразу
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localVideo.srcObject = stream;
                statusMsg.innerText = "КАМЕРА ГОТОВА";
            })
            .catch(err => statusMsg.innerText = "ОШИБКА КАМЕРЫ");

        peer.on('open', (id) => {
            const urlParams = new URLSearchParams(window.location.search);
            const joinId = urlParams.get('join');
            if (joinId) {
                statusMsg.innerText = "ПОДКЛЮЧЕНИЕ К ДРУГУ...";
                connectToFriend(joinId);
            }
        });

        function startDuel() {
            const duelUrl = window.location.origin + window.location.pathname + "?join=" + peer.id;
            navigator.clipboard.writeText(duelUrl);
            alert("Ссылка для друга скопирована!");
            statusMsg.innerText = "ОЖИДАНИЕ ПРОТИВНИКА...";
        }

        peer.on('call', (call) => {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                call.answer(stream);
                call.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.style.display = 'block';
                    statusMsg.innerText = "ДУЭЛЬ НАЧАТА!";
                });
            });
        });

        function connectToFriend(id) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                const call = peer.call(id, stream);
                call.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.style.display = 'block';
                    statusMsg.innerText = "ДУЭЛЬ НАЧАТА!";
                });
            });
        }
    </script>
</body>
</html>
