<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IRON ARENA PRO</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #ffcc00; --bg: #050505; --card: rgba(20, 20, 22, 0.9); }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* ФОН С БОДИБИЛДЕРАМИ */
        .global-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1583454110551-21f2fa2ec617?q=80&w=1470&auto=format&fit=crop'); 
            background-size: cover; background-position: center; z-index: -1;
        }

        .screen { display: none; width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; flex-direction: column; gap: 10px; z-index: 10; }
        .active { display: flex; }
        
        /* ПРОФИЛЬ И LVL */
        .lvl-container { background: var(--card); padding: 12px; border-radius: 15px; border: 1px solid #333; backdrop-filter: blur(10px); }
        .lvl-bar { height: 6px; background: #222; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .lvl-fill { height: 100%; background: var(--accent); width: 0%; transition: 1s; box-shadow: 0 0 10px var(--accent); }

        .card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #333; text-align: center; backdrop-filter: blur(10px); }
        .btn { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; transition: 0.2s; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }

        /* АРЕНА */
        .battle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .video-box { position: relative; width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 15px; overflow: hidden; border: 2px solid #444; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* АККУРАТНЫЕ ЧАСЫ */
        #timer-wrap { align-self: center; background: rgba(0,0,0,0.8); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--accent); font-family: monospace; font-size: 18px; color: var(--accent); margin-bottom: 5px; }

        /* ЧАТ РЕАКЦИЙ */
        .reactions { display: flex; justify-content: center; gap: 20px; margin-top: 5px; }
        .reaction-btn { font-size: 30px; cursor: pointer; transition: 0.2s; filter: grayscale(0.5); }
        .reaction-btn:hover { transform: scale(1.3); filter: grayscale(0); }

        .score-val { font-size: 22px; font-weight: 900; color: var(--accent); }
        .result-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
    </style>
</head>
<body>

    <div class="global-bg"></div>

    <div id="result-screen" class="result-overlay">
        <h2 id="win-lose-text" style="font-size: 40px; margin: 0;"></h2>
        <p id="score-details" style="font-size: 20px; color: var(--accent);"></p>
        <button class="btn" style="width: 200px; background: #ffaa00; margin-bottom: 10px;" onclick="sendRematch()">РЕВАНШ</button>
        <button class="btn btn-outline" style="width: 200px;" onclick="location.reload()">В МЕНЮ</button>
    </div>

    <div id="menu" class="screen active">
        <div class="lvl-container">
            <div style="display: flex; justify-content: space-between; font-size: 11px;">
                <span id="display-nick">CHAMPION</span>
                <span>LVL: <span id="lvl-val">1</span> (<span id="xp-val">0/3</span>)</span>
            </div>
            <div class="lvl-bar"><div id="lvl-fill" class="lvl-fill"></div></div>
        </div>
        <div class="card" style="margin-top: 50px;">
            <h1 style="color:var(--accent); font-style: italic; margin-bottom: 20px;">IRON ARENA</h1>
            <button class="btn" onclick="showScreen('profile')">ИЗМЕНИТЬ ПРОФИЛЬ</button>
            <div style="height: 10px;"></div>
            <button class="btn btn-outline" onclick="showScreen('lobby')">НАЙТИ ОППОНЕНТА</button>
        </div>
    </div>

    <div id="profile" class="screen">
        <div class="card">
            <h2>НАСТРОЙКИ</h2>
            <input type="text" id="nick-input" placeholder="Твой ник" style="width:90%; padding:10px; margin-bottom:10px; border-radius:10px; border:none;">
            <input type="color" id="color-input" style="width:100%; height:40px; border:none; background:none;">
            <button class="btn" onclick="saveProfile()" style="margin-top:20px;">СОХРАНИТЬ</button>
        </div>
    </div>

    <div id="lobby" class="screen">
        <div class="card">
            <h2>ЛОББИ</h2>
            <button class="btn" onclick="copyMyID()">КОПИРОВАТЬ МОЙ ID</button>
            <p id="my-id-display" style="font-size:10px; color:#777; margin: 10px 0;"></p>
            <input type="text" id="peer-id-input" placeholder="ВСТАВЬ ID ДРУГА" style="width:90%; padding:10px; margin-bottom:10px; border-radius:10px; border:none;">
            <button class="btn btn-outline" onclick="connectToPeer()">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <div id="arena" class="screen">
        <div id="timer-wrap">TIME: <span id="timer-val">15</span>s</div>
        <div class="battle-grid">
            <div class="video-box">
                <video id="localVideo" autoplay muted playsinline></video>
                <div style="position:absolute; bottom:5px; left:5px; font-size:10px; background:rgba(0,0,0,0.5); padding:2px 5px;">YOU</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div style="position:absolute; bottom:5px; left:5px; font-size:10px; background:rgba(0,0,0,0.5); padding:2px 5px;">ENEMY</div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="card" style="padding:10px;"><div id="my-score" class="score-val">0.0</div></div>
            <div class="card" style="padding:10px;"><div id="enemy-score" class="score-val">0.0</div></div>
        </div>

        <div class="reactions">
            <div class="reaction-btn" onclick="sendEmoji('🔥')">🔥</div>
            <div class="reaction-btn" onclick="sendEmoji('👎')">👎</div>
            <div class="reaction-btn" onclick="sendEmoji('💪')">💪</div>
        </div>

        <button id="start-btn" class="btn" style="margin-top:10px; display:none;" onclick="startBattle()">START BATTLE</button>
    </div>

    <canvas id="motionCanvas" style="display:none;" width="100" height="150"></canvas>

    <script>
        const peer = new Peer();
        let conn, myStream, myScore = 0, enemyScore = 0, isBattle = false;
        let lastFrameData = null;

        // Инициализация
        function updateUI() {
            const wins = parseInt(localStorage.getItem('wins') || '0');
            const nick = localStorage.getItem('nick') || 'CHAMPION';
            const color = localStorage.getItem('color') || '#ffcc00';
            document.getElementById('lvl-val').innerText = Math.floor(wins/3) + 1;
            document.getElementById('xp-val').innerText = (wins%3) + "/3";
            document.getElementById('lvl-fill').style.width = ((wins%3)/3*100) + "%";
            document.documentElement.style.setProperty('--accent', color);
            document.getElementById('display-nick').innerText = nick;
        }
        updateUI();

        function saveProfile() {
            localStorage.setItem('nick', document.getElementById('nick-input').value);
            localStorage.setItem('color', document.getElementById('color-input').value);
            updateUI(); showScreen('menu');
        }

        async function initCam() {
            myStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('localVideo').srcObject = myStream;
        }
        initCam();

        peer.on('open', id => document.getElementById('my-id-display').innerText = id);
        function copyMyID() { navigator.clipboard.writeText(peer.id); alert("ID Скопирован!"); }

        function connectToPeer() {
            const id = document.getElementById('peer-id-input').value;
            conn = peer.connect(id); setupConn(conn);
            peer.call(id, myStream).on('stream', s => { document.getElementById('remoteVideo').srcObject = s; showScreen('arena'); });
        }

        peer.on('connection', c => setupConn(c));
        peer.on('call', call => {
            call.answer(myStream);
            call.on('stream', s => { document.getElementById('remoteVideo').srcObject = s; showScreen('arena'); });
        });

        function setupConn(c) {
            conn = c;
            document.getElementById('start-btn').style.display = 'block';
            conn.on('data', data => {
                if(data.type === 'EMOJI') showFloatingEmoji(data.val);
                if(data.type === 'START') runBattleLogic();
                if(data.type === 'SCORE') document.getElementById('enemy-score').innerText = data.val;
                if(data.type === 'FINAL') { enemyScore = data.val; finalize(); }
            });
        }

        function sendEmoji(e) { if(conn) conn.send({type: 'EMOJI', val: e}); showFloatingEmoji(e); }
        function sendStart() { if(conn) { conn.send({type:'START'}); runBattleLogic(); } }

        function showFloatingEmoji(e) {
            const el = document.createElement('div');
            el.innerText = e;
            el.style.position = 'fixed';
            el.style.left = Math.random() * 80 + 10 + '%';
            el.style.bottom = '0';
            el.style.fontSize = '50px';
            el.style.transition = '2s';
            el.style.zIndex = '1000';
            document.body.appendChild(el);
            setTimeout(() => { el.style.bottom = '100vh'; el.style.opacity = '0'; }, 50);
            setTimeout(() => el.remove(), 2000);
        }

        function startBattle() { conn.send({type:'START'}); runBattleLogic(); }

        function runBattleLogic() {
            isBattle = true; myScore = 0;
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('result-screen').style.display = 'none';
            
            let t = 15;
            const timerIv = setInterval(() => {
                document.getElementById('timer-val').innerText = t;
                t--;
                if(t < 0) { 
                    clearInterval(timerIv); isBattle = false; 
                    conn.send({type:'FINAL', val: myScore}); finalize();
                }
            }, 1000);

            // ДЕТЕКТОР ДВИЖЕНИЯ
            const canvas = document.getElementById('motionCanvas');
            const ctx = canvas.getContext('2d');
            const video = document.getElementById('localVideo');

            const sense = setInterval(() => {
                if(!isBattle) { clearInterval(sense); return; }
                ctx.drawImage(video, 0, 0, 100, 150);
                const currentFrame = ctx.getImageData(0,0,100,150).data;
                if(lastFrameData) {
                    let diff = 0;
                    for(let i=0; i<currentFrame.length; i+=4) {
                        diff += Math.abs(currentFrame[i] - lastFrameData[i]);
                    }
                    if(diff > 500000) { // Порог движения
                        myScore += (diff / 1000000);
                        const displayScore = myScore.toFixed(1);
                        document.getElementById('my-score').innerText = displayScore;
                        conn.send({type:'SCORE', val: displayScore});
                    }
                }
                lastFrameData = currentFrame;
            }, 100);
        }

        function finalize() {
            if(!isBattle && enemyScore > 0) {
                const win = myScore > enemyScore;
                if(win) {
                    localStorage.setItem('wins', parseInt(localStorage.getItem('wins') || '0') + 1);
                    updateUI();
                }
                document.getElementById('win-lose-text').innerText = win ? "ПОБЕДА!" : "ПРОИГРЫШ";
                document.getElementById('win-lose-text').style.color = win ? "#00ff88" : "#ff3366";
                document.getElementById('score-details').innerText = `${myScore.toFixed(1)} XP vs ${parseFloat(enemyScore).toFixed(1)} XP`;
                document.getElementById('result-screen').style.display = 'flex';
            }
        }
        
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
