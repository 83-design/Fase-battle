<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FACE ARENA 1V1</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #00d9ff; --bg: #050505; --card: #121214; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        .screen { display: none; width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; flex-direction: column; gap: 15px; }
        .active { display: flex; }

        .lvl-container { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid #222; }
        .lvl-bar { height: 8px; background: #222; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .lvl-fill { height: 100%; background: var(--accent); width: 0%; transition: 0.5s; }

        .card { background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid #222; text-align: center; }
        input { background: #1a1a1c; border: 1px solid #333; color: white; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; margin: 10px 0; outline: none; text-align: center; }
        .btn { background: var(--accent); color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 800; cursor: pointer; width: 100%; text-transform: uppercase; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }

        .battle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .video-box { position: relative; width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 18px; overflow: hidden; border: 1px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* АНИМИРОВАННЫЕ ТОЧКИ */
        .scanner-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; }
        .scanning .scanner-overlay { opacity: 1; }
        .dot { position: absolute; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); animation: pulse 1.5s infinite alternate; }
        
        @keyframes pulse { 
            from { opacity: 0.3; transform: scale(0.8); } 
            to { opacity: 1; transform: scale(1.2); } 
        }

        #timer-display { font-size: 40px; font-weight: 900; text-align: center; color: var(--accent); height: 50px; }
        .result-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <div id="result-screen" class="result-overlay">
        <h2 id="win-lose-text" style="font-size: 48px;"></h2>
        <p id="score-details" style="font-size: 24px; color: var(--accent);"></p>
        <button class="btn" style="width: 200px;" onclick="location.reload()">В МЕНЮ</button>
    </div>

    <div id="menu" class="screen active">
        <div class="lvl-container">
            <div style="display: flex; justify-content: space-between; font-size: 12px;">
                <span>УРОВЕНЬ: <span id="lvl-val">1</span></span>
                <span id="xp-val">0/3 ПОБЕД</span>
            </div>
            <div class="lvl-bar"><div id="lvl-fill" class="lvl-fill"></div></div>
        </div>
        <h1 id="main-nick" style="text-align:center; color:var(--accent)">ARENA MOD</h1>
        <div class="card">
            <button class="btn" onclick="showScreen('profile')">ПРОФИЛЬ</button>
            <div style="height: 10px;"></div>
            <button class="btn btn-outline" onclick="showScreen('lobby')">ДУЭЛЬ 1V1</button>
        </div>
    </div>

    <div id="profile" class="screen">
        <div class="card">
            <h1>НАСТРОЙКИ</h1>
            <input type="text" id="nick-input" placeholder="Твой ник">
            <input type="color" id="color-input">
            <button class="btn" onclick="saveProfile()">СОХРАНИТЬ</button>
        </div>
    </div>

    <div id="lobby" class="screen">
        <div class="card">
            <h1>ЛОББИ</h1>
            <button class="btn" onclick="createRoom()">СОЗДАТЬ ID</button>
            <p id="my-id-text" style="font-size:10px; color:#555; margin-top:5px;"></p>
            <input type="text" id="join-id-input" placeholder="ID ДРУГА">
            <button class="btn btn-outline" onclick="joinRoom()">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <div id="arena" class="screen">
        <div id="timer-display">READY?</div>
        <div class="battle-grid" id="battle-grid">
            <div class="video-box">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="scanner-overlay" id="scan1"></div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="scanner-overlay" id="scan2"></div>
            </div>
        </div>
        <button id="start-btn" class="btn" style="margin-top: 15px; display:none;" onclick="sendStart()">START BATTLE</button>
    </div>

    <script>
        const peer = new Peer();
        let conn, myStream, remoteScore = null, myFinalScore = null;
        let wins = parseInt(localStorage.getItem('wins') || '0');
        let nick = localStorage.getItem('nick') || 'PLAYER';
        let color = localStorage.getItem('color') || '#00d9ff';

        function updateUI() {
            document.getElementById('lvl-val').innerText = Math.floor(wins/3) + 1;
            document.getElementById('xp-val').innerText = (wins%3) + "/3 ПОБЕД";
            document.getElementById('lvl-fill').style.width = ((wins%3)/3*100) + "%";
            document.documentElement.style.setProperty('--accent', color);
            document.getElementById('main-nick').innerText = nick;
        }
        updateUI();

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function saveProfile() {
            localStorage.setItem('nick', document.getElementById('nick-input').value);
            localStorage.setItem('color', document.getElementById('color-input').value);
            location.reload();
        }

        // ЖЕСТКИЙ ЗАХВАТ КАМЕРЫ
        async function initCamera() {
            myStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('localVideo').srcObject = myStream;
        }
        initCamera();

        peer.on('open', id => document.getElementById('my-id-text').innerText = "ID: " + id);

        function createRoom() {
            navigator.clipboard.writeText(peer.id);
            alert("ID скопирован! Скинь другу.");
        }

        async function joinRoom() {
            const id = document.getElementById('join-id-input').value;
            conn = peer.connect(id);
            handleConn(conn);
            peer.call(id, myStream).on('stream', s => {
                document.getElementById('remoteVideo').srcObject = s;
                showScreen('arena');
                document.getElementById('start-btn').style.display = 'block';
            });
        }

        peer.on('connection', c => handleConn(c));
        peer.on('call', call => {
            call.answer(myStream);
            call.on('stream', s => {
                document.getElementById('remoteVideo').srcObject = s;
                showScreen('arena');
                document.getElementById('start-btn').style.display = 'block';
            });
        });

        function handleConn(c) {
            conn = c;
            conn.on('data', data => {
                if(data === 'START') runBattle();
                if(data.type === 'RESULT') {
                    remoteScore = data.val;
                    tryFinalize();
                }
            });
        }

        function sendStart() { conn.send('START'); runBattle(); }

        function runBattle() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('battle-grid').classList.add('scanning');
            genDots('scan1'); genDots('scan2');
            let t = 15;
            const iv = setInterval(() => {
                document.getElementById('timer-display').innerText = t;
                t--;
                if(t < 0) {
                    clearInterval(iv);
                    myFinalScore = Math.floor(Math.random() * 41) + 60;
                    conn.send({type: 'RESULT', val: myFinalScore});
                    tryFinalize();
                }
            }, 1000);
        }

        function genDots(id) {
            const b = document.getElementById(id);
            b.innerHTML = '';
            for(let i=0; i<20; i++) {
                const d = document.createElement('div');
                d.className = 'dot';
                d.style.left = Math.random()*90+'%';
                d.style.top = Math.random()*90+'%';
                d.style.animationDelay = Math.random()+'s';
                b.appendChild(d);
            }
        }

        function tryFinalize() {
            if(remoteScore !== null && myFinalScore !== null) {
                const res = document.getElementById('result-screen');
                const txt = document.getElementById('win-lose-text');
                res.style.display = 'flex';
                if(myFinalScore > remoteScore) {
                    wins++; localStorage.setItem('wins', wins);
                    txt.innerText = "ПОБЕДА"; txt.style.color = "#00ff88";
                } else {
                    txt.innerText = "ПОРАЖЕНИЕ"; txt.style.color = "#ff3366";
                }
                document.getElementById('score-details').innerText = `${myFinalScore} XP vs ${remoteScore} XP`;
            }
        }
    </script>
</body>
</html>
