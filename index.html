<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARENA 1V1</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #00d9ff; --bg: #050505; --card: #121214; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; }
        
        .screen { display: none; width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; flex-direction: column; gap: 20px; }
        .active { display: flex; }

        /* Стильный Профиль */
        .card { background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 20px; letter-spacing: 2px; color: var(--accent); margin-bottom: 30px; }
        
        input { background: #1a1a1c; border: 1px solid #333; color: white; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; margin: 10px 0; outline: none; }
        input:focus { border-color: var(--accent); }
        
        .btn { background: var(--accent); color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 800; cursor: pointer; transition: 0.3s; width: 100%; text-transform: uppercase; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }

        /* СЕТКА БАТТЛА (ДВА ОКНА В РЯД) */
        .battle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 20px; }
        .video-box { position: relative; width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 18px; overflow: hidden; border: 1px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); } /* Зеркалка пофикшена */
        
        .label { position: absolute; top: 10px; left: 10px; font-size: 10px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; color: var(--accent); font-weight: bold; }

        #timer-display { font-size: 48px; font-weight: 900; text-align: center; color: var(--accent); text-shadow: 0 0 20px var(--accent); height: 60px; }
        .result-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
    </style>
</head>
<body>

    <div id="result-screen" class="result-overlay">
        <h2 id="win-lose-text" style="font-size: 40px;"></h2>
        <p id="score-details" style="font-size: 20px; color: var(--accent);"></p>
        <button class="btn" style="width: 200px;" onclick="location.reload()">В МЕНЮ</button>
    </div>

    <div id="menu" class="screen active">
        <h1 id="user-display">ARENA MOD</h1>
        <div class="card">
            <button class="btn" onclick="showScreen('profile')">ИЗМЕНИТЬ ПРОФИЛЬ</button>
            <div style="height: 15px;"></div>
            <button class="btn btn-outline" onclick="showScreen('lobby')">ДУЭЛЬ 1V1</button>
        </div>
    </div>

    <div id="profile" class="screen">
        <div class="card">
            <h1>ПРОФИЛЬ</h1>
            <input type="text" id="nick-input" placeholder="Введите ник">
            <input type="color" id="color-input" style="height: 50px; cursor: pointer;">
            <button class="btn" onclick="saveProfile()">СОХРАНИТЬ</button>
        </div>
    </div>

    <div id="lobby" class="screen">
        <div class="card">
            <h1>ЛОББИ</h1>
            <button class="btn" onclick="createRoom()">СОЗДАТЬ И ПОЛУЧИТЬ ID</button>
            <p id="room-id-display" style="font-size: 11px; word-break: break-all; color: #666;"></p>
            <hr style="border: 0.5px solid #222; margin: 20px 0;">
            <input type="text" id="join-id-input" placeholder="Вставьте ID друга">
            <button class="btn btn-outline" onclick="joinRoom()">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <div id="arena" class="screen">
        <div id="timer-display">ГОТОВ?</div>
        <div class="battle-grid">
            <div class="video-box">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="label" id="my-name-label">ТЫ</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="label" id="enemy-name-label">ПРОТИВНИК</div>
            </div>
        </div>
        <button id="start-btn" class="btn" style="margin-top: 20px;" onclick="sendStartSignal()">НАЧАТЬ БАТТЛ</button>
    </div>

    <script>
        const peer = new Peer();
        let conn, myStream, myScore = 0, enemyScore = 0;
        let nick = localStorage.getItem('nick') || 'ИГРОК';
        let color = localStorage.getItem('color') || '#00d9ff';

        document.documentElement.style.setProperty('--accent', color);
        document.getElementById('nick-input').value = nick;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function saveProfile() {
            nick = document.getElementById('nick-input').value;
            color = document.getElementById('color-input').value;
            localStorage.setItem('nick', nick);
            localStorage.setItem('color', color);
            location.reload();
        }

        navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(s => {
            myStream = s;
            document.getElementById('localVideo').srcObject = s;
        });

        function createRoom() {
            document.getElementById('room-id-display').innerText = "ID: " + peer.id;
            navigator.clipboard.writeText(peer.id);
            alert("ID скопирован. Отправь другу!");
        }

        function joinRoom() {
            const id = document.getElementById('join-id-input').value;
            conn = peer.connect(id);
            setupConnection();
            peer.call(id, myStream);
        }

        peer.on('connection', c => { conn = c; setupConnection(); });
        peer.on('call', call => {
            call.answer(myStream);
            call.on('stream', s => { 
                document.getElementById('remoteVideo').srcObject = s; 
                showScreen('arena');
            });
        });

        function setupConnection() {
            showScreen('arena');
            conn.on('data', data => {
                if (data === 'START_BATTLE') startCountdown();
                if (data.type === 'FINAL_SCORE') {
                    enemyScore = data.val;
                    checkWinner();
                }
            });
        }

        function sendStartSignal() {
            conn.send('START_BATTLE');
            startCountdown();
        }

        function startCountdown() {
            document.getElementById('start-btn').style.display = 'none';
            let timeLeft = 15;
            const interval = setInterval(() => {
                document.getElementById('timer-display').innerText = timeLeft;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(interval);
                    finishMatch();
                }
            }, 1000);
        }

        function finishMatch() {
            myScore = Math.floor(Math.random() * 40) + 60; // Имитация анализа 60-100
            conn.send({type: 'FINAL_SCORE', val: myScore});
            document.getElementById('timer-display').innerText = "АНАЛИЗ...";
            if (enemyScore > 0) checkWinner();
        }

        function checkWinner() {
            if (myScore === 0) return; // Ждем свой результат
            const overlay = document.getElementById('result-screen');
            const winText = document.getElementById('win-lose-text');
            const details = document.getElementById('score-details');
            
            overlay.style.display = 'flex';
            details.innerText = `${myScore} XP vs ${enemyScore} XP`;

            if (myScore > enemyScore) {
                winText.innerText = "ПОБЕДА";
                winText.style.color = "#00ff88";
            } else if (myScore < enemyScore) {
                winText.innerText = "ПОРАЖЕНИЕ";
                winText.style.color = "#ff3366";
            } else {
                winText.innerText = "НИЧЬЯ";
            }
        }
    </script>
</body>
</html>
