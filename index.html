<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FACE ARENA 1V1</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        :root { --accent: #40e0d0; --bg: #0a0a0c; --card: #1c1c1e; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; gap: 15px; }
        .active { display: flex; }

        .card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #333; text-align: center; }
        input { background: #2c2c2e; border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; margin: 10px 0; width: 80%; }
        
        .btn { background: var(--accent); color: black; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-outline { background: none; border: 1px solid var(--accent); color: var(--accent); }

        .video-box { position: relative; width: 100%; aspect-ratio: 3/4; background: #000; border-radius: 15px; overflow: hidden; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; font-size: 12px; }

        #timer { font-size: 40px; font-weight: bold; color: var(--accent); text-align: center; }
        .win { color: #34c759; font-size: 30px; }
        .lose { color: #ff3b30; font-size: 30px; }
    </style>
</head>
<body>

    <div id="menu" class="screen active">
        <h1 id="user-display">ПРИВЕТ, БРО</h1>
        <div class="card">
            <button class="btn" style="width:100%" onclick="showScreen('profile')">МОЙ ПРОФИЛЬ</button>
            <br><br>
            <button class="btn btn-outline" style="width:100%" onclick="showScreen('lobby')">ДУЭЛЬ</button>
        </div>
    </div>

    <div id="profile" class="screen">
        <div class="card">
            <h3>РЕДАКТИРОВАТЬ ПРОФИЛЬ</h3>
            <input type="text" id="nick-input" placeholder="Твой ник">
            <div style="margin: 10px 0;">
                Цвет: 
                <input type="color" id="color-input" value="#40e0d0" style="width:50px; padding:0;">
            </div>
            <button class="btn" onclick="saveProfile()">СОХРАНИТЬ</button>
        </div>
    </div>

    <div id="lobby" class="screen">
        <div class="card">
            <button class="btn" onclick="createRoom()">СОЗДАТЬ ЛОББИ</button>
            <p id="room-id-display"></p>
            <hr style="border:0.5px solid #333; width:100%">
            <input type="text" id="join-id-input" placeholder="ID друга">
            <button class="btn btn-outline" onclick="joinRoom()">ЗАЙТИ В ЛОББИ</button>
        </div>
    </div>

    <div id="arena" class="screen">
        <div id="timer">ГОТОВЫ?</div>
        <div class="video-box">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="label" id="my-label">ТЫ</div>
        </div>
        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="label" id="enemy-label">ПРОТИВНИК</div>
        </div>
        <button id="start-btn" class="btn" onclick="sendStart()">СТАРТ БАТТЛ</button>
    </div>

    <script>
        let peer = new Peer();
        let myConn, myCall, myScore = 0;
        let myNick = localStorage.getItem('nick') || 'ИГРОК';
        let myColor = localStorage.getItem('color') || '#40e0d0';

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function saveProfile() {
            myNick = document.getElementById('nick-input').value;
            myColor = document.getElementById('color-input').value;
            localStorage.setItem('nick', myNick);
            localStorage.setItem('color', myColor);
            document.documentElement.style.setProperty('--accent', myColor);
            showScreen('menu');
        }

        // PeerJS Логика
        peer.on('open', id => { console.log('My ID:', id); });

        function createRoom() {
            const shortId = peer.id.substring(0, 5); // Короткий ID
            document.getElementById('room-id-display').innerText = "ID ЛОББИ: " + peer.id;
            alert("Твой ID: " + peer.id + "\nСкинь его другу!");
        }

        function joinRoom() {
            const id = document.getElementById('join-id-input').value;
            connectToFriend(id);
        }

        function connectToFriend(id) {
            myConn = peer.connect(id);
            setupConn(myConn);
            navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(stream => {
                myCall = peer.call(id, stream);
                setupCall(myCall);
            });
        }

        peer.on('connection', conn => setupConn(conn));
        peer.on('call', call => {
            navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(stream => {
                call.answer(stream);
                setupCall(call);
            });
        });

        function setupConn(conn) {
            myConn = conn;
            showScreen('arena');
            myConn.on('data', data => {
                if(data === 'start') runBattle();
                if(data.type === 'score') finalize(data.val);
            });
        }

        function setupCall(call) {
            call.on('stream', stream => {
                document.getElementById('remoteVideo').srcObject = stream;
                document.getElementById('localVideo').srcObject = myStream;
            });
        }

        let myStream;
        navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(s => {
            myStream = s;
            document.getElementById('localVideo').srcObject = s;
        });

        // БАТТЛ
        function sendStart() {
            myConn.send('start');
            runBattle();
        }

        function runBattle() {
            document.getElementById('start-btn').style.display = 'none';
            let sec = 15;
            let interval = setInterval(() => {
                document.getElementById('timer').innerText = sec;
                sec--;
                if(sec < 0) {
                    clearInterval(interval);
                    finishBattle();
                }
            }, 1000);
        }

        function finishBattle() {
            myScore = Math.floor(Math.random() * 101); // Тут будет реальный анализ позже
            myConn.send({type: 'score', val: myScore});
            document.getElementById('timer').innerText = "АНАЛИЗ...";
        }

        function finalize(enemyScore) {
            if(myScore > enemyScore) {
                document.getElementById('timer').innerHTML = `<span class="win">ПОБЕДА!</span><br>${myScore} vs ${enemyScore}`;
            } else {
                document.getElementById('timer').innerHTML = `<span class="lose">ПОРАЖЕНИЕ</span><br>${myScore} vs ${enemyScore}`;
            }
        }
    </script>
</body>
</html>
